<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify × Last.fm 標籤文字雲</title>
  <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1, h2 {
      color: #1DB954;
    }
    button {
      background: #1DB954;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #1ed760;
    }
    #profile-view {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    #avatar {
      border-radius: 50%;
    }
    .section-box {
      background: #1c1c1c;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }
    #wordcloud-canvas {
      width: 100%;
      height: 420px;
      display: block;
    }
    #top-tags-list {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .top-tag-item {
      background: #262626;
      border: 1px solid #1DB954;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 13px;
      color: #fff;
    }
    .top-tag-item .rank {
      color: #1DB954;
      font-weight: bold;
      margin-right: 4px;
    }
    .top-tag-item .count {
      color: #999;
      margin-left: 4px;
    }
    .range-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 14px;
      margin-right: 8px;
      cursor: pointer;
    }
    .range-btn.active {
      background: #1DB954;
      font-weight: bold;
    }
    .fallback-note {
      color: #888;
      font-size: 11px;
      margin-left: 4px;
    }
    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    .track-item img {
      border-radius: 4px;
    }
    .track-stats {
      font-size: 13px;
      color: #999;
    }
    .replay-badge {
      display: inline-block;
      background: #d51007;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      padding: 2px 10px;
      border-radius: 10px;
      margin-left: 6px;
    }
    .tag-chip {
      display: inline-block;
      background: #333;
      color: #ddd;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-right: 4px;
      margin-top: 4px;
    }
    .no-data-note {
      color: #999;
      font-size: 13px;
      margin-top: -4px;
      margin-bottom: 16px;
    }
    .quick-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 8px;
    }
    .quick-stat-item {
      background: #262626;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
    }
    .quick-stat-label {
      display: block;
      font-size: 12px;
      color: #999;
      margin-bottom: 4px;
    }
    .quick-stat-value {
      display: block;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="login-view">
    <h1>Spotify × Last.fm 標籤文字雲</h1>
    <p style="color:#999;">用 Spotify 登入,抓取你短/中/長期最常聽的 50 首歌,串接 Last.fm 顯示標籤文字雲、聽眾數與重播次數。</p>
    <button id="login-btn">用 Spotify 登入</button>
  </div>

  <div id="profile-view" style="display:none;">
    <img id="avatar" width="80" height="80">
    <div>
      <h1 id="display-name-title">你好</h1>
    </div>
  </div>

  <div id="global-loading" style="display:none; color:#999; margin:16px 0; font-size:15px;">
    載入中,正在串接 Last.fm 資料,請稍候...
  </div>

  <div id="wordcloud-view" class="section-box" style="display:none;">
    <h2>我的音樂#tag</h2>
    <canvas id="wordcloud-canvas" width="900" height="420"></canvas>
    <div id="top-tags-list"></div>
  </div>

  <div id="quick-stats-view" class="section-box" style="display:none;">
    <h2 style="margin-top:0;">歌曲概況</h2>
    <div id="quick-stats" class="quick-stats-grid"></div>
  </div>

  <div id="history-view" style="display:none;">
    <h2>最常聽歌曲</h2>
    <div id="time-range-selector" style="margin-bottom:16px;">
      <button class="range-btn" data-range="short_term">這個月</button>
      <button class="range-btn" data-range="medium_term">這半年</button>
      <button class="range-btn" data-range="long_term">這一年</button>
    </div>
    <p class="no-data-note">播放資料根據約3000萬位Last.fm使用者的串流記錄，平均重播=播放數/聽眾數，表示其他人平均播了幾次</p>
    <p class="no-data-note">📀聽眾>500,000 </p>
    <p class="no-data-note">🧊聽眾<1000 </p>
    <p class="no-data-note">🔥平均重播>10 </p>
    <div id="track-list"></div>
  </div>

  <script src="last.js"></script></body>
</html>
