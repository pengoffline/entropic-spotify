<!DOCTYPE html>
<html lang="zh-Hant">
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entropic Spotify</title> <!-- 這行是新的！！！ -->
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1, h2 {
      color: #1DB954;
    }
    button {
      background: #1DB954;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #1ed760;
    }
    #profile-view {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    #avatar {
      border-radius: 50%;
    }
    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    .track-item img {
      border-radius: 4px;
    }
    .decade-block {
      background: #1c1c1c;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .bar-label {
      width: 70px;
      font-size: 14px;
    }
    .bar-track {
      flex: 1;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      height: 18px;
    }
    .bar-fill {
      background: #1DB954;
      height: 100%;
    }
    .bar-count {
      width: 40px;
      text-align: right;
      font-size: 13px;
      color: #ccc;
    }
    .range-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 14px;
      margin-right: 8px;
      cursor: pointer;
    }
    .range-btn.active {
      background: #1DB954;
      font-weight: bold;
    }
    .no-data-note {
      color: #999;
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 16px;
    }
    .entropy-result {
      font-size: 20px;
      margin-top: 12px;
      color: #1DB954;
      font-weight: bold;
    }
    .entropy-explain {
      color: #999;
      font-size: 13px;
    }
    .genre-block {
      background: #1c1c1c;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      max-height: 400px;
      overflow-y: auto;
    }
    .entropy-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .quick-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 8px;
    }
    .quick-stat-item {
      background: #262626;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
    }
    .quick-stat-label {
      display: block;
      font-size: 12px;
      color: #999;
      margin-bottom: 4px;
    }
    .quick-stat-value {
      display: block;
      font-size: 17px;
      font-weight: bold;
      color: #fff;
    }
    .summary-box {
      background: #1c1c1c;
      border: 1px solid #1DB954;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div id="login-view">
    <h1>Entropic Spotify</h1>
    <p style="color:#999;">擷取你最近在Spotify上最愛聽的歌曲，從時代、人氣、曲風分析，用熵值（Entropy）計算出你的歌單有多混亂、音樂品味有多多元</p> <!-- 這行是新的！！！ -->
    <p style="color:#999;">clayhsu.123</p> <!-- 這行是新的！！！ -->
   <button id="login-btn">用 Spotify 登入</button>
    <p style="color:#999;">此網頁不會儲存你的資料，也不會將你的資料讓與其他網站</p> <!-- 這行是新的！！！ -->
  </div>

  <div id="profile-view" style="display:none;">
    <img id="avatar" width="80" height="80">
    <div>
      <h1 id="display-name-title">你好</h1>
    </div>
  </div>

  <div id="taste-summary" class="summary-box" style="display:none;">
    <h2 style="margin-top:0;">🔥我的音樂熵值 Spotify Entropy</h2> <!-- 這行是新的！！！ -->
    <div id="taste-summary-value" style="display:flex; justify-content:center; margin:12px 0;"></div>
    <div id="quick-stats" class="quick-stats-grid"></div>
    <p style="color:#999; font-size:13px; margin-bottom:0;">
      品味混亂程度
    </p>
    <div id="taste-summary-breakdown" style="margin-top:10px; font-size:14px; color:#ccc;"></div>
  </div>

  <div id="global-loading" style="display:none; color:#999; margin:16px 0; font-size:15px;">
    載入中,正在分析你的音樂資料,請稍候...
  </div>

  <div id="decade-view" style="display:none;">
    <h2>年代</h2>
    <div class="entropy-result" id="decade-entropy-result"></div>
    <div class="decade-block" id="decade-bars"></div>
  </div>

  <div id="fame-view" style="display:none;">
    <h2>流行程度</h2>
    <div class="entropy-result" id="fame-entropy-result"></div>
    <div class="decade-block" id="fame-bars"></div>
  </div>

  <div id="genre-view" style="display:none;">
    <h2>音樂類型</h2>
    <div class="entropy-result" id="genre-entropy-result"></div>
    <div class="genre-block" id="genre-bars"></div>
  </div>

  <div id="taste-summary" class="summary-box" style="display:none;">
     <span style="font-weight: bold; font-size:24px"><a href="last.html">>>>>:D請點這裡前往下一頁分析你的聽歌關鍵字>>>></a><span>
  </div>
    
  <div id="history-view" style="display:none;">
    <h2>聆聽紀錄</h2>
    <div id="time-range-selector" style="margin-bottom:16px;">
      <button class="range-btn" data-range="short_term">這個月</button>
      <button class="range-btn" data-range="medium_term">這半年</button>
      <button class="range-btn" data-range="long_term">這一年</button>
    </div>
    <div id="track-list"></div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
