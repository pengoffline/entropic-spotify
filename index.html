<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify 音樂品味多樣性分析</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #181818; padding: 40px; border-radius: 12px; box-shadow: 0 4px 60px rgba(0,0,0,0.5); }
        h1 { color: #1DB954; font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #b3b3b3; font-size: 1.1rem; margin-bottom: 30px; }
        .btn { background: #1DB954; color: white; border: none; padding: 16px 32px; border-radius: 30px; cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); background: #1ed760; }
        section { display: none; }
        #login-section { display: block; }
        canvas { max-width: 100%; margin: 30px 0; }
        ul { list-style: none; padding: 0; text-align: left; max-width: 300px; margin: 20px auto; }
        li { padding: 10px 0; border-bottom: 1px solid #282828; color: #e5e5e5; display: flex; justify-content: space-between; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB954; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <section id="login-section">
            <h1>品味多樣性分析器</h1>
            <p>透過科學公式（香農熵），計算出你音樂品味的混亂程度！</p>
            <button class="btn" onclick="redirectToSpotify()">使用 Spotify 登入</button>
        </section>
        <section id="loading-section">
            <h2>正在讀取大腦數據...</h2><div class="loader"></div>
            <p style="margin-top: 20px;">正在擷取您的 Top 50 聆聽紀錄與歌手流派...</p>
        </section>
        <section id="result-section">
            <h1>分析結果</h1><canvas id="barChart"></canvas>
            <h2 id="score-text" style="color: #1DB954; margin-top: 20px;">綜合得分：--</h2>
            <div style="margin-top: 40px;"><h3>📊 您的五大核心流派</h3><ul id="genre-list"></ul></div>
            <button class="btn" style="margin-top: 40px; background: #555;" onclick="location.href=window.location.origin + window.location.pathname">重新測試</button>
        </section>
    </div>
    <script>
        const clientId = '18a7af28818a40abafa707e98e4d7a48'; 
        const redirectUri = window.location.origin + window.location.pathname;
        async function redirectToSpotify() {
            const verifier = generateRandomString(128);
            const challenge = await generateCodeChallenge(verifier);
            localStorage.setItem("verifier", verifier);
            const params = new URLSearchParams({ client_id: clientId, response_type: "code", redirect_uri: redirectUri, scope: "user-top-read", code_challenge_method: "S256", code_challenge: challenge });
            // 💡 修正這裡：改用反單引號，讓變數正確帶入網址中
            location.href = `https://spotify.com{params}`;
        }
        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                showSection('loading-section');
                try {
                    const token = await getAccessToken(code);
                    await startAnalysis(token);
                } catch (e) {
                    alert("登入過期或發生錯誤，請重新嘗試。");
                    showSection('login-section');
                }
            }
        };
        async function startAnalysis(token) {
            try {
                const trackRes = await fetch('https://spotify.com', { headers: { 'Authorization': `Bearer ${token}` } });
                const trackData = await trackRes.json(); const tracks = trackData.items;
                if (!tracks || tracks.length === 0) { alert("找不到您的聆聽紀錄，請確保這個 Spotify 帳號平時有在聽歌喔！"); showSection('login-section'); return; }
                const years = tracks.map(t => t.album.release_date.substring(0, 4));
                const pops = tracks.map(t => Math.floor(t.popularity / 20));
                const trackArtistIds = tracks.map(t => t.artists?.id).filter(Boolean);
                const artistIds = [...new Set(trackArtistIds)].slice(0, 50).join(',');
                const artistRes = await fetch(`https://spotify.com{artistIds}`, { headers: { 'Authorization': `Bearer ${token}` } });
                const artistData = await artistRes.json();
                const artistGenreMap = {};
                if (artistData && artistData.artists) { artistData.artists.forEach(a => { if(a) artistGenreMap[a.id] = a.genres; }); }
                const genreCounts = {}; const allAssignedGenres = [];
                tracks.forEach(track => {
                    const mainArtistId = track.artists?.id; const genres = artistGenreMap[mainArtistId] || [];
                    let mappedGenre = '其他 (Others)'; const combinedText = genres.join(' ').toLowerCase();
                    if (combinedText.includes('pop') || combinedText.includes('dance')) mappedGenre = '流行 (Pop)';
                    else if (combinedText.includes('rock') || combinedText.includes('metal') || combinedText.includes('punk')) mappedGenre = '搖滾 (Rock)';
                    else if (combinedText.includes('hip hop') || combinedText.includes('rap') || combinedText.includes('trap')) mappedGenre = '嘻哈 (Hip Hop)';
                    else if (combinedText.includes('electronic') || combinedText.includes('house') || combinedText.includes('edm')) mappedGenre = '電子 (Electronic)';
                    else if (combinedText.includes('jazz') || combinedText.includes('soul') || combinedText.includes('r&b')) mappedGenre = '藍調爵士 (Jazz/R&B)';
                    else if (combinedText.includes('indie') || combinedText.includes('alternative')) mappedGenre = '獨立音樂 (Indie)';
                    genreCounts[mappedGenre] = (genreCounts[mappedGenre] || 0) + 1; allAssignedGenres.push(mappedGenre);
                });
                const yearEntropy = calculateEntropy(years); const popEntropy = calculateEntropy(pops); const genreEntropy = calculateEntropy(allAssignedGenres);
                const sortedGenres = Object.entries(genreCounts).sort((a,b) => b - a || a.localeCompare(b)); const top5Genres = sortedGenres.slice(0, 5);
                displayTopGenres(top5Genres); drawChart(yearEntropy, popEntropy, genreEntropy); showSection('result-section');
            } catch (error) { console.error(error); alert("資料讀取或分析時發生錯誤。"); showSection('login-section'); }
        }
        function calculateEntropy(array) {
            if (array.length === 0) return 0; const counts = {}; array.forEach(x => counts[x] = (counts[x] || 0) + 1);
            const probs = Object.values(counts).map(c => c / array.length); return -probs.reduce((sum, p) => sum + p * Math.log2(p), 0);
        }
        function drawChart(y, p, g) {
            const ctx = document.getElementById('barChart').getContext('2d'); const dataValues = [y, p, g].map(v => Math.min(Math.round((v / 2.6) * 100), 100));
            new Chart(ctx, {
                type: 'bar', data: { labels: ['年代跨度', '流行度平衡', '流派豐富度'], datasets: [{ data: dataValues, backgroundColor: ['rgba(29, 185, 84, 0.75)', 'rgba(54, 162, 235, 0.75)', 'rgba(255, 206, 86, 0.75)'], borderColor: ['#1DB954', '#36A2EB', '#FFCE56'], borderWidth: 1 }] },
                options: { indexAxis: 'y', scales: { x: { min: 0, max: 100, grid: { color: '#282828' }, ticks: { color: '#b3b3b3' } }, y: { ticks: { color: '#fff', font: { size: 14 } } } }, plugins: { legend: { display: false } } }
            });
            const totalScore = Math.round(dataValues.reduce((a,b)=>a+b) / 3); document.getElementById('score-text').innerText = `您的音樂多樣性總分：${totalScore} / 100`;
        }
        function displayTopGenres(genres) {
            const list = document.getElementById('genre-list'); list.innerHTML = genres.map(([name, count]) => `<li><span>${name}</span><span>${count} 首歌曲</span></li>`).join('');
        }
        function showSection(id) { document.querySelectorAll('section').forEach(s => s.style.display = 'none'); document.getElementById(id).style.display = 'block'; }
        async function getAccessToken(code) {
            const verifier = localStorage.getItem("verifier");
            const response = await fetch("https://spotify.com", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ client_id: clientId, grant_type: "authorization_code", code: code, redirect_uri: redirectUri, code_verifier: verifier }) });
            const res = await response.json(); return res.access_token;
        }
        function generateRandomString(length) {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; return Array.from({length}, () => possible.charAt(Math.floor(Math.random() * possible.length))).join('');
        }
        async function generateCodeChallenge(codeVerifier) {
            const data = new TextEncoder().encode(codeVerifier); const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
    </script>
</body>
</html>
